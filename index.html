<script>try{var t=localStorage.getItem("theme");if(t==="dark"||t==="light")document.documentElement.setAttribute("data-theme",t)}catch(e){}</script>

<style>
  /* Layout: white page, the booth up top, four strands below. A moving ERS throws colored light across the page. */
  :root{
    --bg:#ffffff;
    --ink:#161616;
    --muted:#6a6a6a;
    --rule:#e4e4e4;
    --amber:#c9741f;
    --shade:#efefef;
    --dark:#0d0d0d;
    --dot:#c9c9c9;
    --blend:overlay;
    --font:"Schibsted Grotesk",Helvetica,Arial,sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root:not([data-theme="light"]){--bg:#121212;--ink:#ececec;--muted:#9b9b9b;--rule:#2b2b2b;--amber:#e59a4c;--shade:#1d1d1d;--dot:#3a3a3a;--blend:screen;color-scheme:dark}
  }
  :root[data-theme="dark"]{--bg:#121212;--ink:#ececec;--muted:#9b9b9b;--rule:#2b2b2b;--amber:#e59a4c;--shade:#1d1d1d;--dot:#3a3a3a;--blend:screen;color-scheme:dark}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink)}
  body{font-family:var(--font);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased;overflow-x:hidden;font-variant-numeric:tabular-nums}
  img{max-width:100%;display:block}
  a{color:inherit}
  :focus-visible{outline:2px solid var(--amber);outline-offset:3px;border-radius:2px}
  .g{padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
  .w{max-width:1120px;margin:0 auto}
  h1,h2,h3{font-weight:600;letter-spacing:-.02em;line-height:1.08;text-wrap:balance}
  .muted{color:var(--muted)}
  .link{text-decoration:underline;text-underline-offset:5px;text-decoration-thickness:1px}
  .link:hover{color:var(--amber)}

  /* ---------- opening ---------- */
  .open{position:fixed;inset:0;z-index:100;background:var(--dark);color:#f2f2f2;display:grid;place-items:center;cursor:pointer;transition:opacity .7s ease}
  .open[hidden]{display:none}
  .open.out{opacity:0;pointer-events:none}
  .open svg{position:absolute;inset:0;width:100%;height:100%}
  .open .line{fill:none;stroke:#f2f2f2;stroke-width:1.6;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
  .open .name{position:relative;text-align:center;padding:0 20px;opacity:0;transform:translateY(6px);transition:opacity .9s ease,transform .9s ease}
  .open.lit .name{opacity:1;transform:none}
  .open .name b{display:block;font-weight:600;letter-spacing:.32em;font-size:clamp(1.3rem,4vw,2.4rem);text-indent:.32em}
  .open .name span{display:block;margin-top:10px;font-size:.9rem;color:rgba(242,242,242,.7);letter-spacing:.04em}
  .open .skip{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:calc(env(safe-area-inset-bottom,0px) + 18px);font-size:.8rem;color:rgba(242,242,242,.55)}

  /* ---------- the roaming light ---------- */
  .gel{position:fixed;left:0;top:0;width:520px;height:520px;margin:-260px 0 0 -260px;border-radius:50%;pointer-events:none;z-index:20;
    background:radial-gradient(circle,var(--gc,#ffb35c) 0%,transparent 62%);opacity:.55;mix-blend-mode:var(--blend);
    transition:transform 3.2s cubic-bezier(.45,.05,.25,1),background 2s ease}
  .cone{position:fixed;inset:0;pointer-events:none;z-index:19;opacity:.12;mix-blend-mode:var(--blend)}

  /* ---------- top bar ---------- */
  .top{position:fixed;inset:0 0 auto;z-index:30;display:flex;justify-content:space-between;align-items:center;
    padding-top:calc(env(safe-area-inset-top,0px) + 14px);padding-bottom:14px;background:var(--bg);color:var(--ink);transition:background .3s,color .3s}
  .top.on-photo{background:transparent;color:#fff}
  .home-name{font-weight:600;text-decoration:none;letter-spacing:-.01em}
  .quick{position:relative}
  .ers{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;cursor:pointer;padding:4px;font:500 .95rem var(--font)}
  .ers svg{width:50px;height:auto;transition:transform 3.2s cubic-bezier(.45,.05,.25,1);transform-origin:70% 50%}
  .quick-menu{position:absolute;right:0;top:calc(100% + 10px);min-width:230px;background:var(--bg);color:var(--ink);border:1px solid var(--rule);
    box-shadow:0 12px 32px rgba(0,0,0,.18);padding:6px 0;display:flex;flex-direction:column;z-index:40}
  .quick-menu[hidden]{display:none}
  .quick-menu a{padding:10px 18px;text-decoration:none;font-weight:500}
  .quick-menu a:hover,.quick-menu a[aria-current="page"]{color:var(--amber)}
  .switch{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:12px 18px;border:0;border-top:1px solid var(--rule);
    background:none;color:var(--ink);font:500 1rem var(--font);cursor:pointer;text-align:left}
  .switch + .switch{border-top:0;padding-top:4px}
  .switch i{position:relative;width:38px;height:22px;border-radius:999px;background:var(--rule);transition:background .2s;flex:none}
  .switch i::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:var(--bg);box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .2s}
  .switch[aria-checked="true"] i{background:var(--amber)}
  .switch[aria-checked="true"] i::after{transform:translateX(16px)}

  /* ---------- home ---------- */
  .hero{position:relative;height:78svh;min-height:460px;background:var(--dark);overflow:hidden}
  .hero img{width:100%;height:100%;object-fit:cover;object-position:50% 40%;filter:brightness(.06);transition:filter 2.6s cubic-bezier(.3,.1,.2,1)}
  .hero.up img{filter:brightness(1)}
  .hero::after{content:"";position:absolute;inset:0 0 auto;height:22%;background:linear-gradient(rgba(0,0,0,.55),transparent);pointer-events:none}
  .hero figcaption{position:absolute;right:max(20px,env(safe-area-inset-right,0px));bottom:14px;color:rgba(255,255,255,.8);font-size:.8rem;margin:0}
  .intro{padding-block:56px 40px}
  .intro .big{font-size:clamp(1.6rem,3.6vw,2.6rem);font-weight:500;line-height:1.2;letter-spacing:-.02em;max-width:26ch;text-wrap:balance}
  .intro .small{color:var(--muted);max-width:56ch;margin-top:16px}
  .strands{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding-bottom:40px}
  .strand{text-decoration:none;display:block}
  .strand .ph{overflow:hidden;aspect-ratio:3/4;background:var(--shade)}
  .strand img{width:100%;height:100%;object-fit:cover;transition:transform .8s cubic-bezier(.2,.7,.2,1)}
  .strand:hover img{transform:scale(1.03)}
  .strand .dots{background:
    radial-gradient(circle at 62% 38%, rgba(227,163,90,.55), transparent 34%),
    radial-gradient(circle,var(--ink) 1.3px,transparent 1.6px) 0 0/16px 16px, var(--bg);
    box-shadow:inset 0 0 0 1px var(--rule)}
  .strand h2{font-size:clamp(1.25rem,2vw,1.6rem);margin-top:12px}
  .strand p{color:var(--muted);font-size:.93rem;margin-top:2px}
  .strand:hover h2{color:var(--amber)}
  .recog{margin:56px 0 40px}
  .recog ul{list-style:none;display:flex;flex-wrap:wrap;gap:6px 0;margin-top:22px}
  .awards{display:grid;grid-template-columns:1fr 1fr 2fr;gap:18px;align-items:start}
  .awards img{width:100%;aspect-ratio:3/4;object-fit:cover}
  .awards figure:nth-child(3) img{aspect-ratio:3/2}
  .awards figcaption{color:var(--muted)}
  .awards figcaption b{display:block;color:var(--ink);font-weight:600}
  .awards figcaption span{margin-right:10px}
  @media (max-width:820px){.awards{grid-template-columns:1fr 1fr}.awards figure:nth-child(3){grid-column:1/-1}}
  .recog li{padding-right:22px;margin-right:22px;border-right:1px solid var(--rule)}
  .recog li:last-child{border-right:0}
  .elsewhere{display:flex;flex-wrap:wrap;gap:10px 30px;padding-top:20px;margin-bottom:90px;border-top:1px solid var(--rule)}

  /* ---------- inner pages ---------- */
  .page{padding-top:calc(env(safe-area-inset-top,0px) + 100px);padding-bottom:100px}
  .kick{color:var(--muted);font-size:.95rem;margin-bottom:8px}
  .page h1{font-size:clamp(2.4rem,6.5vw,4.4rem);margin-bottom:18px}
  .lede{max-width:60ch;color:var(--muted);margin-bottom:40px;font-size:1.1rem}
  .h-sm{color:var(--muted);font-size:.9rem;margin-bottom:8px}
  .sec{margin-top:84px}

  /* market fields */
  .field{position:relative;margin:0 0 64px}
  .field canvas{display:block;width:100%;height:clamp(300px,42vw,460px);background:var(--bg)}
  .field figcaption{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px 20px;border-top:1px solid var(--rule);padding-top:10px;margin-top:0}
  .field figcaption b{color:var(--ink);font-weight:600}

  .bill{display:grid;grid-template-columns:repeat(2,1fr);gap:48px 28px}
  .show{text-decoration:none}
  .show img{aspect-ratio:3/2;object-fit:cover;width:100%;background:var(--shade)}
  .show:first-child{grid-column:1/-1}
  .show:first-child img{aspect-ratio:21/9}
  .bill.odd .show:last-child{grid-column:1/-1}
  .bill.odd .show:last-child img{aspect-ratio:2/1;object-position:50% 40%}
  .show h2{font-size:clamp(1.4rem,2.6vw,1.9rem);margin-top:14px}
  .show p{color:var(--muted);font-size:.95rem}
  .show:hover h2{color:var(--amber)}

  .rows > *{display:grid;grid-template-columns:1fr 1.4fr auto;gap:6px 28px;align-items:baseline;text-decoration:none;padding:18px 0;border-top:1px solid var(--rule)}
  .rows > :last-child{border-bottom:1px solid var(--rule)}
  .rows b{font-weight:600;font-size:1.15rem}
  .rows .d{color:var(--muted)}
  .rows .go{font-weight:500;white-space:nowrap}
  .rows a:hover b,.rows a:hover .go{color:var(--amber)}

  .back{display:inline-block;color:var(--muted);text-decoration:none;margin-bottom:22px}
  .back:hover{color:var(--ink)}
  .credits{display:flex;flex-wrap:wrap;gap:14px 44px;margin:6px 0 30px}
  .credits span{display:block;color:var(--muted);font-size:.85rem}
  .lead-photo img{width:100%;max-height:78vh;object-fit:cover}
  figcaption{color:var(--muted);font-size:.85rem;margin-top:8px}
  .split{display:grid;grid-template-columns:1.25fr 1fr;gap:56px;margin-top:40px;align-items:start}
  .story{font-size:1.15rem;line-height:1.6;max-width:56ch}
  .sheet dl div{display:flex;justify-content:space-between;gap:20px;padding:11px 0;border-top:1px solid var(--rule)}
  .sheet dl div:last-child{border-bottom:1px solid var(--rule)}
  .sheet dt{color:var(--muted)}
  .sheet dd{font-weight:600;text-align:right}
  .more{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;margin-top:48px}
  .more img{width:100%;aspect-ratio:4/3;object-fit:cover}
  .next{margin-top:64px;padding-top:20px;border-top:1px solid var(--rule)}

  .thesis{font-size:clamp(1.5rem,3.4vw,2.4rem);font-weight:500;letter-spacing:-.02em;line-height:1.2;max-width:26ch;text-wrap:balance;margin-bottom:28px}
  .lenses{display:grid;grid-template-columns:repeat(4,1fr);gap:24px}
  .lens{border-top:2px solid var(--c);padding-top:12px}
  .lens h3{font-size:1.15rem;margin-bottom:6px}
  .lens p{color:var(--muted);font-size:.95rem}
  .takes{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
  .takes article{border-top:2px solid var(--ink);padding-top:14px}
  .takes h3{font-size:1.3rem;margin-bottom:10px}
  .takes p{font-size:1rem;line-height:1.6}
  @media (max-width:900px){.takes{grid-template-columns:1fr}}
  .ask{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:16px 30px;padding:24px 0;border-top:1px solid var(--rule);border-bottom:1px solid var(--rule)}
  .ask p{max-width:56ch}

  .places{display:grid;gap:64px}
  .place{display:grid;grid-template-columns:1fr 1fr;gap:40px;align-items:center}
  .place:nth-child(even) .pic{order:2}
  .place .pic img{width:100%;aspect-ratio:4/5;object-fit:cover}
  .place h2{font-size:clamp(2rem,5vw,3.4rem)}
  .place .when{color:var(--muted);margin:2px 0 14px}
  .place p.txt{font-size:1.1rem;max-width:44ch}

  .contact a.big{display:block;font-weight:600;letter-spacing:-.02em;font-size:clamp(1.5rem,4.5vw,2.6rem);text-decoration:none;margin-bottom:10px;overflow-wrap:anywhere}
  .contact a.big:hover{color:var(--amber)}

  @media (max-width:980px){ .strands{grid-template-columns:repeat(2,1fr)} .lenses{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:820px){
    .bill{grid-template-columns:1fr;gap:40px}
    .show:first-child img,.bill.odd .show:last-child img{aspect-ratio:3/2}
    .split{grid-template-columns:1fr;gap:32px}
    .rows > *{grid-template-columns:1fr auto}
    .rows .d{grid-column:1/-1;order:3}
    .place{grid-template-columns:1fr;gap:16px}
    .place:nth-child(even) .pic{order:0}
    .place .pic img{aspect-ratio:3/2}
    .ers .lbl{display:none}
    .gel{width:340px;height:340px;margin:-170px 0 0 -170px}
  }
  @media (max-width:520px){ .strands,.lenses{grid-template-columns:1fr} .strand .ph{aspect-ratio:3/2} }
  @media (prefers-reduced-motion:reduce){.open,.open .name,.strand img,.hero img,.gel,.ers svg{transition:none}}
</style>
</head>

      return p.url ? `<a href="${esc(p.url)}">${inner}</a>` : `<div>${inner}</div>`; }).join("")}</div>`;
  }
  function technical(){
    view.innerHTML = `<div class="page g"><div class="w">
      <p class="kick">What I build and question</p><h1>Technical</h1>
      <p class="lede">How people decide with money, and how machines decide about people.</p>
      <p class="h-sm">AI ethics and safety</p>${rowList(ETHICS)}
      <div class="sec"><p class="h-sm">Tools I’ve built</p>${rowList(TOOLS)}</div>
    </div></div>`;
  }

  function creative(){
    const c = CREATIVE;
    view.innerHTML = `<div class="page g"><div class="w">
      <p class="kick">The other side of me</p><h1>Creative</h1>
      <div class="credits">${c.credits.map(([k, v]) => `<div><span>${esc(k)}</span>${esc(v)}</div>`).join("")}</div>
      ${fig(c.lead, "lead-photo")}
      <div class="split"><p class="story">${esc(c.story)}</p><div></div></div>
      <div class="more">${c.photos.map(x => fig(x)).join("")}</div>
    </div></div>`;
  }

  function journey(){
    view.innerHTML = `<div class="page g"><div class="w">
      <p class="kick">Four cities</p><h1>A global life</h1>
      <p class="lede">In the order I lived them.</p>
      <div class="places">${JOURNEY.map(j => `<div class="place"><div class="pic">${fig(j.photo)}</div>
        <div><h2>${esc(j.place)}</h2><p class="when">${esc(j.when)}</p><p class="txt">${esc(j.text)}</p></div></div>`).join("")}</div>
    </div></div>`;
  }

  function contact(){
    view.innerHTML = `<div class="page g"><div class="w contact">
      <p class="kick">Contact</p><h1>Say hello</h1>
      <p class="lede">Building something early, or want a memo? Email is fastest.</p>
      <a class="big" href="mailto:${esc(CONTACT.email)}">${esc(CONTACT.email)}</a>
      <a class="big" href="${esc(CONTACT.linkedin)}">LinkedIn</a>
      <a class="big" href="${esc(CONTACT.resume)}">Resume (PDF)</a>
    </div></div>`;
  }

  /* ---------- menu and dark mode ---------- */
  const qBtn = document.getElementById("quickBtn"), qMenu = document.getElementById("quickMenu"), tBtn = document.getElementById("themeBtn");
  const setQ = open => { qMenu.hidden = !open; qBtn.setAttribute("aria-expanded", open); };
  qBtn.onclick = e => { e.stopPropagation(); setQ(qMenu.hidden); if (!qMenu.hidden) qMenu.querySelector("a").focus(); };
  qMenu.addEventListener("click", e => { if (e.target.closest("a")) setQ(false); });
  document.addEventListener("click", e => { if (!qMenu.hidden && !e.target.closest(".quick")) setQ(false); });
  addEventListener("keydown", e => { if (e.key === "Escape" && !qMenu.hidden){ setQ(false); qBtn.focus(); } });
  const dm = matchMedia("(prefers-color-scheme: dark)");
  const isDark = () => { const t = document.documentElement.getAttribute("data-theme"); return t ? t === "dark" : dm.matches; };
  const syncTheme = () => tBtn.setAttribute("aria-checked", isDark());
  tBtn.onclick = () => { const n = isDark() ? "light" : "dark"; document.documentElement.setAttribute("data-theme", n); try { localStorage.setItem("theme", n); } catch (e) {} syncTheme(); };
  dm.addEventListener ? dm.addEventListener("change", syncTheme) : dm.addListener(syncTheme);
  syncTheme();

  function syncBar(){ const h = document.getElementById("hero"); top.classList.toggle("on-photo", !!h && scrollY < h.offsetHeight - 70); }
  addEventListener("scroll", syncBar, { passive: true });

  /* ---------- routing ---------- */
  function route(){
    if (stopField){ stopField(); stopField = null; }
    const h = location.hash.slice(1);
    if (h === "private" || h === "projects") privateMarkets();
    else if (h.startsWith("p-")) production(h.slice(2));
    else if (h === "public") publicMarkets();
    else if (h === "technical") technical();
    else if (h === "creative" || h === "theatre") creative();
    else if (h === "journey") journey();
    else if (h === "contact") contact();
    else home();
    scrollTo(0, 0); syncBar();
    const key = h.startsWith("p-") ? "private" : h;
    qMenu.querySelectorAll("a").forEach(a => { const on = a.getAttribute("href") === "#" + key || (!key && a.getAttribute("href") === "#");
      on ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
    if (h) view.focus({ preventScroll: true });
    if (lightOn) setTimeout(roam, 400);
  }
  addEventListener("hashchange", route);
  route();
  setLight(lightOn);
  opening();
})();
</script>
</body>
</html>
